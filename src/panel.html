<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家宽代理控制台</title>
<style>
:root{
  --ink:#16222b; --muted:#5b6b75; --paper:#f2f5f3; --card:#ffffff; --line:#d5dde0;
  --up:#0f8b7a; --warn:#a86a10; --down:#b3382c; --accent:#0f5c8c;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{--ink:#e4ecef;--muted:#93a5af;--paper:#0f171c;--card:#16222a;--line:#2a3a44;--up:#35c2ad;--warn:#e0a446;--down:#ef7a6c;--accent:#6bb7e6;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e4ecef;--muted:#93a5af;--paper:#0f171c;--card:#16222a;--line:#2a3a44;--up:#35c2ad;--warn:#e0a446;--down:#ef7a6c;--accent:#6bb7e6;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
main{max-width:1080px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px;font-weight:650}
.warn{border-left:4px solid var(--warn);padding:8px 12px;margin-bottom:16px;background:var(--card);color:var(--ink)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px}
td.mono,.mono{font-family:var(--mono);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.up{background:var(--up)} .dot.connecting{background:var(--warn)} .dot.off{background:var(--down)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
input{width:130px}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:12.5px;resize:vertical}
button{font:inherit;cursor:pointer;color:#fff;background:var(--accent);border:0;border-radius:4px;padding:7px 14px}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);padding:4px 10px;font-size:13px}
button.danger{color:var(--down)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{margin:0;max-height:260px;overflow:auto;font:12.5px/1.6 var(--mono);color:var(--muted)}
.cmd{display:flex;gap:8px;align-items:center}
.cmd code{flex:1;overflow-x:auto;white-space:nowrap;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-family:var(--mono);font-size:12.5px}
.empty{color:var(--muted);padding:12px 0}
.flag{color:var(--warn)}
</style>
</head>
<body>
<main>
  <h1>家宽代理控制台</h1>
  <p class="sub">节点心跳、出口质检、换 IP 与目标国家，都在这里管理。</p>

  <div id="warn" class="warn" hidden>代理账号密码尚未配置（PROXY_USER / PROXY_PASS）。未配置时 agent 会拒绝所有代理连接。</div>

  <section>
    <h2>节点</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>状态</th><th>节点</th><th>代理入口</th><th>出口 IP</th><th>国家</th><th>ISP</th><th>延迟</th><th>最近心跳</th><th></th></tr></thead>
        <tbody id="nodes"></tbody>
      </table>
    </div>
    <div id="nodes-empty" class="empty" hidden>还没有节点接入。复制下面的安装命令，在一台海外 Linux VPS 上以 root 执行。</div>
  </section>

  <section>
    <h2>调度策略</h2>
    <div class="row">
      <label>目标国家（两位代码，或 ANY）<input id="country" maxlength="3" autocomplete="off"></label>
      <label>代理端口<input id="port" inputmode="numeric" autocomplete="off"></label>
      <button id="save">保存策略</button>
      <span id="save-msg" class="sub" style="margin:0"></span>
    </div>
  </section>

  <section>
    <h2>接入新节点</h2>
    <div class="cmd"><code id="install"></code><button class="ghost" data-copy="install">复制</button></div>
  </section>

  <section>
    <h2>可用代理列表</h2>
    <div class="row" style="margin-bottom:8px">
      <button class="ghost" id="fmt-socks">SOCKS5</button>
      <button class="ghost" id="fmt-http">HTTP</button>
      <button class="ghost" id="copy-list">复制</button>
    </div>
    <textarea id="list" readonly placeholder="节点就绪后，这里会列出 scheme://用户:密码@IP:端口"></textarea>
  </section>

  <section>
    <h2>日志</h2>
    <pre id="logs"></pre>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let scheme = "socks5", formReady = false;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function cell(tr, text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  tr.appendChild(td);
  return td;
}

function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? s + " 秒前" : s < 3600 ? Math.round(s / 60) + " 分钟前" : Math.round(s / 3600) + " 小时前";
}

function render(st) {
  $("warn").hidden = st.proxy_auth_set;
  $("install").textContent = st.install_cmd;
  if (!formReady) { $("country").value = st.policy.country; $("port").value = st.policy.port; formReady = true; }

  const body = $("nodes");
  body.replaceChildren();
  $("nodes-empty").hidden = st.nodes.length > 0;
  for (const n of st.nodes) {
    const tr = document.createElement("tr");
    const state = !n.online ? "off" : n.status === "up" ? "up" : "connecting";
    const label = !n.online ? "离线" : n.status === "up" ? "在线" : "连接中";
    const s = cell(tr, "");
    const dot = document.createElement("span"); dot.className = "dot " + state;
    s.append(dot, label);
    cell(tr, n.id);
    cell(tr, n.host && n.port ? n.host + ":" + n.port : "-", "mono");
    cell(tr, n.exit_ip || "-", "mono");
    cell(tr, n.country || "-");
    const isp = cell(tr, (n.isp || "-"));
    if (n.hosting) { const f = document.createElement("span"); f.className = "flag"; f.textContent = "（机房）"; isp.appendChild(f); }
    cell(tr, n.latency ? n.latency + " ms" : "-");
    cell(tr, ago(st.now - n.last_seen));
    const ops = document.createElement("td");
    const rot = document.createElement("button"); rot.className = "ghost"; rot.textContent = "换 IP";
    rot.onclick = async () => { rot.disabled = true; try { await api("/api/rotate", { node_id: n.id }); } finally { setTimeout(refresh, 800); } };
    const del = document.createElement("button"); del.className = "ghost danger"; del.textContent = "移除"; del.style.marginLeft = "6px";
    del.onclick = async () => { if (confirm("从面板移除节点 " + n.id + "？（agent 仍会重新上报）")) { await api("/api/nodes/delete", { node_id: n.id }); refresh(); } };
    ops.append(rot, del); tr.appendChild(ops);
    body.appendChild(tr);
  }

  $("logs").textContent = st.logs.slice().reverse()
    .map((l) => "[" + l.node_id + "] " + l.line).join("\n");
}

async function loadList() {
  const r = await fetch("/api/proxies?scheme=" + scheme);
  $("list").value = await r.text();
}

async function refresh() {
  try { render(await api("/api/state")); await loadList(); } catch (e) { $("save-msg").textContent = String(e.message || e); }
}

$("save").onclick = async () => {
  try {
    await api("/api/policy", { country: $("country").value.trim(), port: $("port").value.trim() });
    $("save-msg").textContent = "已保存，节点会在下一次心跳（约 15 秒）内生效";
  } catch (e) { $("save-msg").textContent = e.message; }
};
$("fmt-socks").onclick = () => { scheme = "socks5"; loadList(); };
$("fmt-http").onclick = () => { scheme = "http"; loadList(); };
$("copy-list").onclick = () => navigator.clipboard.writeText($("list").value);
document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => navigator.clipboard.writeText($(b.dataset.copy).textContent));

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
